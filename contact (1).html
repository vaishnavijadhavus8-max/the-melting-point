<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | The Melting Point</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #fcf8f2; text-align: center; color: #333; }
        nav { background-color: #2c2c2c; padding: 15px; }
        nav a { color: #fcf8f2; margin: 0 20px; text-decoration: none; font-size: 18px; font-weight: bold; }
        nav a:hover { color: #ffbc42; }
        .logo-container { margin-top: 20px; }
        .brand-logo { width: 100px; height: auto; }
        .form-container { max-width: 450px; margin: 20px auto 40px auto; background: white; padding: 35px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); text-align: left; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input[type="submit"] { background-color: #2c2c2c; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        input[type="submit"]:hover { background-color: #ffbc42; color: #2c2c2c; }
        .footer-info { margin-top: 30px; color: #777; font-size: 15px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="logo-container">
        <img src="logo.jpg" alt="The Melting Point Logo" class="brand-logo">
    </div>

    <h1>Contact Us 📞</h1>
    <p>Have questions or custom bulk order requirements? Get in touch with us!</p>

    <div class="form-container">
        <form action="#" method="post">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="message">Message / Custom Requirements:</label>
            <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

            <input type="submit" value="Submit Query">
        </form>
    </div>

    <div class="footer-info">
        <p>📧 Email: support@themeltingpoint.com | 📱 Instagram: @themeltingpoint</p>
        <p>© 2026 The Melting Point. All Fire Safety Standards Applied.</p>
    </div>

</body>
</html>
